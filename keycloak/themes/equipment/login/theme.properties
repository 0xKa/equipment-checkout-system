# Equipment Checkout login theme.
#
# Inherit Keycloak's maintained login markup and behavior, then layer the
# project's branding on top. Keeping template overrides out of this theme makes
# authentication flows such as password reset and OTP less fragile on upgrades.
parent=keycloak.v2
import=common/keycloak

# The styles property replaces the parent's list, so include the parent
# stylesheet before the project-specific overrides.
styles=css/styles.css css/custom.css

locales=en
darkMode=false
