name: equipment-checkout-system

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  keycloak-postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:?KEYCLOAK_POSTGRES_DB is required}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:?KEYCLOAK_POSTGRES_USER is required}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:?KEYCLOAK_POSTGRES_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_HTTP_PORT:?KEYCLOAK_HTTP_PORT is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:?KEYCLOAK_HTTP_PORT is required}:8080"
    expose:
      - "9000"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.0
    profiles:
      - bootstrap
    entrypoint:
      - /bin/bash
      - /opt/keycloak/bootstrap/bootstrap-development-users.sh
    environment:
      KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME is required}
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      KEYCLOAK_EQUIPMENT_ADMIN_PASSWORD: ${KEYCLOAK_EQUIPMENT_ADMIN_PASSWORD:?KEYCLOAK_EQUIPMENT_ADMIN_PASSWORD is required}
      KEYCLOAK_SAMPLE_BORROWER_PASSWORD: ${KEYCLOAK_SAMPLE_BORROWER_PASSWORD:?KEYCLOAK_SAMPLE_BORROWER_PASSWORD is required}
      KEYCLOAK_AUDIT_VIEWER_PASSWORD: ${KEYCLOAK_AUDIT_VIEWER_PASSWORD:?KEYCLOAK_AUDIT_VIEWER_PASSWORD is required}
    volumes:
      - ./keycloak/scripts:/opt/keycloak/bootstrap:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: api
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: ${HTTP_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-1}
      DB_MAX_CONNECTION_LIFETIME: ${DB_MAX_CONNECTION_LIFETIME:-30m}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${HTTP_PORT}/ready"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  keycloak_postgres_data:
    name: ${KEYCLOAK_POSTGRES_VOLUME_NAME:?KEYCLOAK_POSTGRES_VOLUME_NAME is required}
