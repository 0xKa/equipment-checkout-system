openapi: 3.1.0
info:
  title: Equipment Checkout API
  version: 1.0.0
  description: |
    REST API for inventory, local users, and transactional equipment checkout
    and return workflows.

    Every `/api/v1` operation requires a Keycloak access token. Select
    **Authorize** and enter the token without the `Bearer` prefix. Access also
    depends on the token-derived application role and, for employee checkout
    operations, ownership of the relevant record.
servers:
  - url: /
    description: Current API origin
tags:
  - name: Health
    description: Public process liveness and database readiness.
  - name: Current user
    description: The active local user resolved from the access token.
  - name: Items
    description: Inventory items and their checkout history.
  - name: Categories
    description: Inventory categories.
  - name: Users
    description: Application-owned local user profiles.
  - name: Checkouts
    description: Equipment borrowing and return workflows.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process liveness
      description: Returns process liveness without contacting PostgreSQL.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                const: healthy
              example: healthy
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database readiness
      description: Performs a bounded PostgreSQL ping.
      security: []
      responses:
        "200":
          description: The API and database are ready.
          content:
            text/plain:
              schema:
                type: string
                const: ready
              example: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me:
    get:
      tags: [Current user]
      operationId: getCurrentUser
      summary: Get the authenticated local user
      description: Accepts any recognized application role.
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/items:
    get:
      tags: [Items]
      operationId: listItems
      summary: List inventory items
      description: Requires `inventory.read`. Results are ordered by ascending ID.
      responses:
        "200":
          description: Inventory items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Items]
      operationId: createItem
      summary: Create an inventory item
      description: Requires `inventory.manage`. New items start as `available`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          $ref: "#/components/responses/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/items/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Items]
      operationId: getItem
      summary: Get an inventory item
      description: Requires `inventory.read`.
      responses:
        "200":
          $ref: "#/components/responses/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Items]
      operationId: replaceItem
      summary: Replace an inventory item
      description: |
        Requires `inventory.manage`. Fully replaces client-editable fields while
        preserving the server-owned status and dormant location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          $ref: "#/components/responses/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Items]
      operationId: deleteItem
      summary: Delete an inventory item
      description: Requires `inventory.manage`.
      responses:
        "204":
          description: The item was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/items/{id}/checkouts:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Items, Checkouts]
      operationId: listItemCheckouts
      summary: List checkout history for an item
      description: Requires `checkout.history.read_all`; available to administrators and auditors.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/CheckoutList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Items, Checkouts]
      operationId: checkoutItem
      summary: Check out an item
      description: |
        Employees can check out only for their own local user. Administrators
        can perform on-behalf checkouts. The actor is always derived from the
        access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
      responses:
        "201":
          $ref: "#/components/responses/Checkout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List inventory categories
      description: Requires `inventory.read`. Results are ordered by ascending ID.
      responses:
        "200":
          description: Inventory categories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create an inventory category
      description: Requires `inventory.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          $ref: "#/components/responses/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get an inventory category
      description: Requires `inventory.read`.
      responses:
        "200":
          $ref: "#/components/responses/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Categories]
      operationId: replaceCategory
      summary: Replace an inventory category
      description: Requires `inventory.manage` and fully replaces client-editable fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          $ref: "#/components/responses/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete an inventory category
      description: Requires `inventory.manage`.
      responses:
        "204":
          description: The category was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List local users
      description: Requires `users.manage`. Results are ordered by ascending ID.
      parameters:
        - name: is_active
          in: query
          required: false
          description: Return only active or inactive users.
          schema:
            type: boolean
      responses:
        "200":
          description: Local users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a managed user
      description: Requires `users.manage`. Creates an active Keycloak identity with one application realm role and a linked local user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a local user
      description: Requires `users.manage`.
      responses:
        "200":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      operationId: replaceUser
      summary: Replace a managed user profile
      description: Requires `users.manage`. Synchronizes Keycloak and PostgreSQL while preserving role and activation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deprovisionUser
      summary: Soft-deprovision a managed user
      description: Requires `users.manage`. Disables Keycloak and marks the local user inactive without deleting history.
      responses:
        "204":
          description: The managed user was disabled in both systems.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Users]
      operationId: updateUserRole
      summary: Replace a managed user's application role
      description: Requires `users.manage`. Replaces only the three managed application realm roles and updates the local role column.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Activate or deactivate a managed user
      description: Requires `users.manage`. Synchronizes Keycloak `enabled` and the local activation flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/temporary-password:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    put:
      tags: [Users]
      operationId: setTemporaryUserPassword
      summary: Set a temporary Keycloak password
      description: Requires `users.manage`. The password is sent directly to Keycloak and is never stored or returned by the application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTemporaryPasswordRequest"
      responses:
        "204":
          description: Temporary password set; Keycloak requires replacement at next sign-in.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/checkouts:
    get:
      tags: [Checkouts]
      operationId: listCheckouts
      summary: List checkout records
      description: |
        Employees receive only their own records. Administrators and auditors
        can read all records. Results are ordered by descending ID.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/CheckoutList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/checkouts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [Checkouts]
      operationId: getCheckout
      summary: Get a checkout record
      description: Employees can read only their own record. Administrators and auditors can read any record.
      responses:
        "200":
          $ref: "#/components/responses/Checkout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/checkouts/{id}/return:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [Checkouts]
      operationId: returnCheckout
      summary: Return a checked-out item
      description: |
        Employees can return only their own checkout. Administrators can return
        any active checkout. The return recipient is always derived from the
        access token.
      responses:
        "200":
          $ref: "#/components/responses/Checkout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/RequestTimeout"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token issued for the `equipment-api` audience.
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      description: Positive local resource identifier.
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum records returned.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Records skipped before this page.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
  responses:
    Item:
      description: Inventory item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ItemResponse"
    Category:
      description: Inventory category.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CategoryResponse"
    User:
      description: Local user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserResponse"
    Checkout:
      description: Checkout record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CheckoutResponse"
    CheckoutList:
      description: A bounded page of checkout records.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CheckoutListResponse"
    BadRequest:
      description: The path, query, content type, or JSON body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: A Bearer credential is missing or invalid.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The actor, identity profile, role, ownership, or local account state denies access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found or is not visible to this actor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The operation conflicts with uniqueness, lifecycle, or reference state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTimeout:
      description: The request exceeded its 15-second deadline.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: PostgreSQL readiness or bounded Keycloak user administration is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ItemInput:
      type: object
      additionalProperties: false
      required: [asset_tag, name]
      properties:
        asset_tag:
          type: string
          minLength: 1
          description: Unique asset tag after trimming.
          example: EQ-LAP-001
        name:
          type: string
          minLength: 1
          description: Item name after trimming.
          example: Development Laptop
        description:
          type: string
          default: ""
          example: Sample laptop for local development
        serial_number:
          type: string
          default: ""
          description: Empty is stored as SQL NULL.
          example: DEV-LAPTOP-001
        category_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
          default: null
          description: Null or omission leaves or sets the item uncategorized.
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Unique category name after trimming.
          example: Laptops
        description:
          type: string
          default: ""
          example: Portable computers
    UserProfileInput:
      type: object
      additionalProperties: false
      required: [username, display_name]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 255
          description: Unique username after trimming and case folding.
          example: j.smith
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          default: null
          description: Optional unique email stored in lowercase.
          example: j.smith@example.test
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: User-facing name after trimming.
          example: Jordan Smith
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username, display_name, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 255
          description: Unique username after trimming and case folding.
          example: j.smith
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          default: null
          description: Optional unique email stored in lowercase.
          example: j.smith@example.test
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact application display name mirrored to Keycloak.
          example: Jordan Smith
        role:
          $ref: "#/components/schemas/UserRole"
    UserRole:
      type: string
      enum: [employee, inventory_admin, auditor]
      example: employee
    UpdateUserRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    UpdateUserStatusRequest:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active:
          type: boolean
    SetTemporaryPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
    CreateCheckoutRequest:
      type: object
      additionalProperties: false
      required: [borrower_user_id]
      properties:
        borrower_user_id:
          type: integer
          format: int64
          minimum: 1
          description: Active local borrower. Employees must supply their own local user ID.
        due_at:
          type: [string, "null"]
          format: date-time
          default: null
          description: Optional future due time.
        notes:
          type: string
          default: ""
    Item:
      type: object
      additionalProperties: false
      required:
        - id
        - category_id
        - asset_tag
        - name
        - description
        - serial_number
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        category_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
        asset_tag:
          type: string
        name:
          type: string
        description:
          type: string
        serial_number:
          type: string
          description: Empty when the database value is NULL.
        status:
          type: string
          enum: [available, checked_out, maintenance, retired]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      additionalProperties: false
      required: [id, name, description, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, username, email, display_name, role, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Checkout:
      type: object
      additionalProperties: false
      required:
        - id
        - item_id
        - borrower_user_id
        - created_by_user_id
        - returned_to_user_id
        - checked_out_at
        - due_at
        - returned_at
        - notes
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        item_id:
          type: integer
          format: int64
          minimum: 1
        borrower_user_id:
          type: integer
          format: int64
          minimum: 1
        created_by_user_id:
          type: integer
          format: int64
          minimum: 1
        returned_to_user_id:
          type: [integer, "null"]
          format: int64
          minimum: 1
        checked_out_at:
          type: string
          format: date-time
        due_at:
          type: [string, "null"]
          format: date-time
        returned_at:
          type: [string, "null"]
          format: date-time
        notes:
          type: string
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, count, total]
      properties:
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        offset:
          type: integer
          format: int32
          minimum: 0
        count:
          type: integer
          minimum: 0
        total:
          type: integer
          format: int64
          minimum: 0
    ItemResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Item"
    ItemListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    CategoryResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
    UserListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
    CheckoutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Checkout"
    CheckoutListResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Checkout"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_request
        message:
          type: string
          example: request is invalid
        request_id:
          type: string
          description: Correlation identifier when available.
